name: Update F1 data and retrain model

permissions:
  contents: write

on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Ingest latest data
        run: python data_pipeline/ingest.py
      - name: Build features
        run: python data_pipeline/build_features.py
      - name: Retrain model
        run: python model/train.py
      - name: Commit updated data and model
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add f1.db model/model.pkl model/feature_cols.pkl model/fill_values.pkl
          git diff --staged --quiet || git commit -m "Automated data + model update"
          git pull --rebase origin main
          git push